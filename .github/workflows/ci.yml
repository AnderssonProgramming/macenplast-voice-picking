name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: macenplast
          POSTGRES_PASSWORD: macenplast
          POSTGRES_DB: macenplast
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U macenplast"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg://macenplast:macenplast@localhost:5432/macenplast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Alembic upgrade
        run: alembic upgrade head
      - name: Pytest
        run: pytest
      - name: OpenAPI schema is up to date
        run: python scripts/export_openapi.py --check

  web:
    name: Web (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest
        run: npm test
