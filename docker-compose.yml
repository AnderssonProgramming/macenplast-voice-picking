services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-macenplast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-macenplast}
      POSTGRES_DB: ${POSTGRES_DB:-macenplast}
    ports:
      # Host port 5442, not 5432: this machine already runs three native
      # PostgreSQL Windows services (v16/17/18) bound to 5432, 5433, and
      # 5434. Only host-side tools (local Alembic/pytest runs) need this
      # mapping — the `api` container talks to `postgres:5432` over the
      # Docker network regardless.
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-macenplast}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-macenplast}:${POSTGRES_PASSWORD:-macenplast}@postgres:5432/${POSTGRES_DB:-macenplast}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      VOICE_CLIP_DIR: /voice_clips
    ports:
      - "8000:8000"
    volumes:
      - voice_clips:/voice_clips
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  voice_clips:
  web_node_modules:
